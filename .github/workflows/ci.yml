name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend + analysis-engine tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip_dev_password
          POSTGRES_DB: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://cip:cip_dev_password@localhost:5432/cip
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python dependencies (backend + analysis-engine workspace)
        run: uv sync

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run analysis-engine tests
        run: uv run --project analysis-engine pytest analysis-engine/tests -q

      - name: Run backend tests
        run: uv run --project backend pytest backend/tests -q

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build (tsc -b && vite build)
        run: pnpm --filter frontend run build

  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oxlint
        run: pnpm --filter frontend run lint
